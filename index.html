<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zel's 7th Birthday Invitation</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #84334C;
            --accent-pink: #F8C8D2;
            --light-pink: #FDF7F8;
            --border-pink: #F3D2D7;
            --text-dark: #5A2A38;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            background-color: #FDF5F6;
            background-image: url('Image/background-bg.jpg'); 
            background-repeat: repeat-y;
            background-size: 100% auto;
            color: var(--text-dark);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* MAGICAL FLOATING SPARKLES ANIMATION */
        @keyframes floatSparkle {
            0% { transform: translateY(0px) rotate(0deg) scale(0.8); opacity: 0.3; }
            50% { transform: translateY(-25px) rotate(180deg) scale(1.2); opacity: 0.9; }
            100% { transform: translateY(0px) rotate(360deg) scale(0.8); opacity: 0.3; }
        }

        .magic-sparkle {
            position: absolute;
            color: #E63956;
            pointer-events: none;
            z-index: 50;
            animation: floatSparkle 4s ease-in-out infinite;
        }

        /* WELCOME COVER PAGE NA MAY BACKGROUND IMAGE */
        #welcome-cover {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #FDF5F6;
            background-image: url('Image/hero.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        /* HEARTBEAT ANIMATION PARA SA CARD */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.04); }
            28% { transform: scale(1); }
            42% { transform: scale(1.04); }
            70% { transform: scale(1); }
        }

        .cover-card {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid var(--border-pink);
            border-radius: 20px;
            padding: 50px 30px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(132, 51, 76, 0.15);
            position: relative;
            animation: heartbeat 2.5s infinite ease-in-out;
        }

        .cover-card h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            color: var(--primary-color);
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .cover-card h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            line-height: 1.1;
        }

        .cover-card p {
            font-size: 0.9rem;
            color: #7A4C58;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .open-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 0.85rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(132, 51, 76, 0.3);
            transition: all 0.3s ease;
        }

        .open-btn:hover {
            opacity: 0.9;
            transform: translateY(-3px);
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(253, 245, 246, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
        }

        .nav-brand img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .nav-links a {
            color: var(--primary-color);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .nav-links a:hover {
            opacity: 0.7;
        }

        /* Hero Section */
        .hero-section {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 40px 60px 50px 60px;
            gap: 60px;
            max-width: 1300px;
            margin: 0 auto;
            position: relative;
        }

        .hero-polaroid-wrapper {
            position: relative;
            margin-left: 80px;
            flex-shrink: 0;
        }

        .side-handwriting {
            position: absolute;
            left: -170px;
            top: 110px;
            font-family: 'Great Vibes', cursive;
            color: var(--primary-color);
            font-size: 1.75rem;
            line-height: 1.25;
            transform: rotate(-12deg);
            transform-origin: top right;
            white-space: nowrap;
            z-index: 6;
            pointer-events: none;
            text-align: right;
        }

        .polaroid-container {
            background: #ffffff;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(132, 51, 76, 0.12);
            transform: rotate(-3deg);
            position: relative;
            width: 300px;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .polaroid-container:hover {
            transform: rotate(0deg) scale(1.02);
        }

        .polaroid-img-wrapper {
            position: relative;
            width: 100%;
            height: 360px;
            overflow: hidden;
        }

        .polaroid-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-bow {
            position: absolute;
            top: -15px;
            left: -15px;
            width: 50px;
            height: 50px;
            z-index: 5;
        }

        .sparkle-1 {
            position: absolute;
            top: 20px;
            left: -40px;
            color: var(--primary-color);
            font-size: 1.2rem;
            animation: pulse 2s infinite;
        }

        .hero-content {
            text-align: center;
            max-width: 450px;
            margin-top: 20px;
            flex-grow: 1;
        }

        .special-invitation {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--primary-color);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .hero-content h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.2rem;
            color: var(--primary-color);
            line-height: 1.1;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .hero-content h1 span {
            display: block;
            font-size: 4.5rem;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .hero-date {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: var(--primary-color);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .hero-desc {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #7A4C58;
            margin-bottom: 25px;
        }

        .cta-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 13px 28px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(132, 51, 76, 0.25);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .cta-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .sub-tagline {
            font-size: 0.8rem;
            color: #8C5A66;
            margin-top: 12px;
            font-style: italic;
        }

        .hero-right-image-container {
            width: 250px;
            flex-shrink: 0;
            text-align: center;
            cursor: pointer;
        }

        .hero-right-image-container img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(132, 51, 76, 0.15);
            border: 3px solid #ffffff;
        }

        /* Countdown Section */
        .countdown-section {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--border-pink);
            max-width: 900px;
            margin: 40px auto 60px auto;
            border-radius: 8px;
            padding: 25px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 5px 20px rgba(132, 51, 76, 0.04);
